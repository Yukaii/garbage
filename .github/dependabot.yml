# Weekly dependency updates, grouped so routine bumps arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Web app (bun.lock)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # React Compiler 1.0 needs Babel 7; plugin-react 6 supports plugin-babel ^0.1/^0.2 (see AGENTS.md)
      - dependency-name: "@babel/core"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/babel__core"
        update-types: [version-update:semver-major]
      - dependency-name: "@rolldown/plugin-babel"
        update-types: [version-update:semver-minor, version-update:semver-major]

  # MCP server (mcp/bun.lock)
  - package-ecosystem: bun
    directory: /mcp
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
