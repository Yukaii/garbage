name: Update Trash Collection Data

# Refreshes each city from its open-data portal (scripts/data/update.ts), publishes
# whatever passed validation to the `data` branch, and redeploys the site when a
# city's data changed. One city failing never blocks the others, and any failure
# opens (or comments on) a `data-pipeline` issue so it can't go unnoticed.

on:
  schedule:
    # Mondays 02:00 UTC (10:00 Taipei). Cheap: nothing is deployed unless data changed.
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Publish even if a city lost more than 20% of its records'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # data.kcg.gov.tw only answers Taiwan networks: GitHub-hosted runners (Azure) and Vercel
  # (US and Hong Kong) can't even open a connection. This job runs on a self-hosted runner
  # in Taiwan (label `taiwan`) and only downloads the raw file; parsing and validation stay
  # on GitHub's runners. If that runner is offline the job waits in the queue (up to 24h),
  # then the other cities are still published and the failure is reported.
  download-kaohsiung:
    name: Download kaohsiung (Taiwan runner)
    runs-on: [self-hosted, taiwan]
    timeout-minutes: 10
    steps:
      - name: Download from data.kcg.gov.tw
        run: |
          curl -fsS --retry 3 --retry-all-errors --retry-delay 15 -m 120 \
            -o kaohsiung.json https://data.kcg.gov.tw/Json/Get/14fe516d-ac62-4905-9325-70daae7616bd
          ls -l kaohsiung.json
      - uses: actions/upload-artifact@v7
        with:
          name: kaohsiung-upstream
          path: kaohsiung.json
          retention-days: 7

  fetch:
    name: Fetch ${{ matrix.city }}
    needs: download-kaohsiung
    # The other cities don't need Kaohsiung's download to have succeeded
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        city: [taipei, new-taipei, taichung, kaohsiung]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Fetch the data branch (published files + geocode caches)
        run: git fetch --depth=1 origin data:refs/remotes/origin/data

      - name: Get Kaohsiung's file from the Taiwan runner
        if: matrix.city == 'kaohsiung'
        uses: actions/download-artifact@v8
        with:
          name: kaohsiung-upstream
          path: upstream

      - name: Fetch and validate
        env:
          KAOHSIUNG_SOURCE_URL: ${{ matrix.city == 'kaohsiung' && format('file://{0}/upstream/kaohsiung.json', github.workspace) || '' }}
        run: >-
          bun scripts/data/update.ts "${{ matrix.city }}" --out out --data-ref origin/data
          ${{ inputs.allow_shrink && '--allow-shrink' || '' }}

      # Uploaded even on failure so the missing-geocode report is available
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: data-${{ matrix.city }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish to data branch
    needs: fetch
    # Publish the cities that succeeded even when another one failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # dispatch the deploy workflow
    steps:
      - uses: actions/checkout@v7
        with:
          path: main

      - uses: actions/checkout@v7
        with:
          ref: data
          path: data
          # Full history (without old blobs) so record-meta can date unchanged files
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/download-artifact@v8
        continue-on-error: true # no artifacts when every city failed
        with:
          pattern: data-*
          path: incoming

      - name: Apply refreshed files
        id: apply
        run: |
          shopt -s nullglob
          refreshed=()
          # A city's artifact holds its data file only if it passed validation
          for json in incoming/data-*/*.json; do
            city=$(basename "$(dirname "$json")"); city="${city#data-}"
            cp "$json" data/
            refreshed+=("$city")
          done
          if [ ${#refreshed[@]} -eq 0 ]; then
            echo "No city refreshed successfully."
            exit 0
          fi
          bun main/scripts/data/record-meta.ts data "${refreshed[@]}"

          cd data
          git add -A -- '*.json'
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          # meta.json alone changes on every run (checkedAt); only data files warrant a deploy
          if git diff --cached --quiet -- . ':!meta.json'; then
            data_changed=false
          else
            data_changed=true
          fi
          echo "data_changed=$data_changed" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          changed=$(git diff --cached --name-only -- . ':!meta.json' | tr '\n' ' ')
          git commit -m "Data refresh $(date -u +%Y-%m-%d)" -m "Checked: ${refreshed[*]}" -m "Changed: ${changed:-none}"
          git push origin HEAD:data

      - name: Redeploy site
        if: steps.apply.outputs.data_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

  report:
    name: Report pipeline status
    needs: [fetch, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ needs.fetch.result == 'failure' || needs.publish.result == 'failure' }}
    steps:
      - name: Open, update or close the data-pipeline issue
        run: |
          open_issue=$(gh issue list --label data-pipeline --state open --json number -q '.[0].number' || true)
          if [ "$FAILED" = "true" ]; then
            gh label create data-pipeline --color B60205 --description "Automated data refresh failures" --force
            body="Data refresh failed: $RUN_URL

          Cities that passed validation were still published. The run summary shows which city failed and why; its artifact has any addresses missing from the geocode cache."
            if [ -n "$open_issue" ]; then
              gh issue comment "$open_issue" --body "$body"
            else
              gh issue create --title "Data refresh is failing" --label data-pipeline --body "$body"
            fi
          elif [ -n "$open_issue" ]; then
            gh issue close "$open_issue" --comment "Recovered: $RUN_URL"
          fi
