name: Update Trash Collection Data

on:
  schedule:
    # Run on the 1st day of every month at 2:00 AM UTC (10:00 AM Taipei Time)
    - cron: '0 2 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data

      - name: Fetch latest data from Taipei City API
        run: |
          echo "Fetching Taipei City trash collection data..."

          # Fetch data in batches (API limit is 1000 per request)
          curl -s "https://data.taipei/api/v1/dataset/a6e90031-7ec4-4089-afb5-361a4efe7202?scope=resourceAquire&limit=1000&offset=0" > temp1.json
          curl -s "https://data.taipei/api/v1/dataset/a6e90031-7ec4-4089-afb5-361a4efe7202?scope=resourceAquire&limit=1000&offset=1000" > temp2.json
          curl -s "https://data.taipei/api/v1/dataset/a6e90031-7ec4-4089-afb5-361a4efe7202?scope=resourceAquire&limit=1000&offset=2000" > temp3.json
          curl -s "https://data.taipei/api/v1/dataset/a6e90031-7ec4-4089-afb5-361a4efe7202?scope=resourceAquire&limit=1000&offset=3000" > temp4.json
          curl -s "https://data.taipei/api/v1/dataset/a6e90031-7ec4-4089-afb5-361a4efe7202?scope=resourceAquire&limit=1000&offset=4000" > temp5.json

          # Merge all batches into a single JSON file
          jq -s '{result: {count: .[0].result.count, limit: ((.[0].result.results | length) + (.[1].result.results | length) + (.[2].result.results | length) + (.[3].result.results | length) + (.[4].result.results | length)), offset: 0, sort: "", results: (.[0].result.results + .[1].result.results + .[2].result.results + .[3].result.results + .[4].result.results)}}' temp1.json temp2.json temp3.json temp4.json temp5.json > trash-collection-points.json

          # Clean up temporary files
          rm temp*.json

          # Display stats
          RECORD_COUNT=$(jq '.result.results | length' trash-collection-points.json)
          FILE_SIZE=$(du -h trash-collection-points.json | cut -f1)
          echo "Fetched $RECORD_COUNT Taipei City records"
          echo "File size: $FILE_SIZE"

      - name: Fetch latest data from New Taipei City API
        run: |
          echo "Fetching New Taipei City trash collection data..."

          # Fetch data in pages (API returns paginated data with page size 10000)
          # Page 0: 10,000 entries
          # Page 1: 10,000 entries
          # Page 2: 6,822 entries
          # Total: 26,822 entries across 29 districts
          curl -s "https://data.ntpc.gov.tw/api/datasets/edc3ad26-8ae7-4916-a00b-bc6048d19bf8/json?page=0&size=10000" > ntpc-page0.json
          curl -s "https://data.ntpc.gov.tw/api/datasets/edc3ad26-8ae7-4916-a00b-bc6048d19bf8/json?page=1&size=10000" > ntpc-page1.json
          curl -s "https://data.ntpc.gov.tw/api/datasets/edc3ad26-8ae7-4916-a00b-bc6048d19bf8/json?page=2&size=10000" > ntpc-page2.json

          # Merge all pages into a single JSON array
          jq -s 'add' ntpc-page0.json ntpc-page1.json ntpc-page2.json > new-taipei-trash-collection-points.json

          # Clean up temporary files
          rm ntpc-page*.json

          # Display stats
          NTPC_RECORD_COUNT=$(jq 'length' new-taipei-trash-collection-points.json)
          NTPC_FILE_SIZE=$(du -h new-taipei-trash-collection-points.json | cut -f1)
          NTPC_DISTRICTS=$(jq '[.[].city] | unique | length' new-taipei-trash-collection-points.json)
          echo "Fetched $NTPC_RECORD_COUNT New Taipei City records"
          echo "Covering $NTPC_DISTRICTS districts"
          echo "File size: $NTPC_FILE_SIZE"

      - name: Check for changes
        id: check_changes
        run: |
          TAIPEI_CHANGED=false
          NTPC_CHANGED=false

          if ! git diff --quiet trash-collection-points.json; then
            TAIPEI_CHANGED=true
            echo "Changes detected in Taipei City data"
          fi

          if ! git diff --quiet new-taipei-trash-collection-points.json; then
            NTPC_CHANGED=true
            echo "Changes detected in New Taipei City data"
          fi

          if [ "$TAIPEI_CHANGED" = true ] || [ "$NTPC_CHANGED" = true ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "taipei_changed=$TAIPEI_CHANGED" >> $GITHUB_OUTPUT
            echo "ntpc_changed=$NTPC_CHANGED" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAIPEI_RECORD_COUNT=$(jq '.result.results | length' trash-collection-points.json)
          TAIPEI_IMPORT_DATE=$(jq -r '.result.results[0]._importdate.date' trash-collection-points.json)
          NTPC_RECORD_COUNT=$(jq 'length' new-taipei-trash-collection-points.json)
          NTPC_DISTRICTS=$(jq '[.[].city] | unique | length' new-taipei-trash-collection-points.json)

          # Build commit message
          COMMIT_MSG="Monthly data update: $(date +'%Y-%m-%d')"
          COMMIT_LINES=()

          if [ "${{ steps.check_changes.outputs.taipei_changed }}" = "true" ]; then
            COMMIT_LINES+=("- Updated Taipei City data: $TAIPEI_RECORD_COUNT records")
            COMMIT_LINES+=("- Data import date: $TAIPEI_IMPORT_DATE")
            git add trash-collection-points.json
          fi

          if [ "${{ steps.check_changes.outputs.ntpc_changed }}" = "true" ]; then
            COMMIT_LINES+=("- Updated New Taipei City data: $NTPC_RECORD_COUNT records across $NTPC_DISTRICTS districts")
            git add new-taipei-trash-collection-points.json
          fi

          COMMIT_BODY=$(printf '%s\n' "${COMMIT_LINES[@]}")

          git commit -m "$COMMIT_MSG" \
            -m "" \
            -m "$COMMIT_BODY" \
            -m "" \
            -m "- Automated update via GitHub Actions" \
            -m "" \
            -m "🤖 Automated update"

          git push origin data

      - name: No changes detected
        if: steps.check_changes.outputs.changed == 'false'
        run: |
          echo "Data is already up to date. No commit needed."
