name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Run on the 2nd day of every month at 3:00 AM UTC (11:00 AM Taipei Time)
    # This runs after the data update workflow to deploy the updated data
    - cron: '0 3 2 * *'
  workflow_dispatch: # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Dump latest data into public directory
        run: |
          git fetch origin data:data
          bun run dump-data

      - name: Trim public data files
        run: ./.github/actions/trim-data.sh

      - name: Build
        env:
          VITE_ADSENSE_CLIENT_ID: ${{ secrets.VITE_ADSENSE_CLIENT_ID }}
          VITE_ADSENSE_SLOT_ID: ${{ secrets.VITE_ADSENSE_SLOT_ID }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # upload-pages-artifact v4+ skips dotfiles; /.well-known/ must ship
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      # Empty unless the repository secret is configured. Optional IndexNow steps
      # below check this value, so they are skipped without failing the deploy.
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # IndexNow notifies Bing, Yandex, Naver and Seznam about the sitemap URLs.
      # Optional: runs only when INDEXNOW_KEY exists, after the deploy succeeded,
      # and a submission failure must not fail the deployment.
      - name: Checkout sitemap for IndexNow
        if: env.INDEXNOW_KEY != ''
        uses: actions/checkout@v7

      - name: Setup Bun for IndexNow
        if: env.INDEXNOW_KEY != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Submit sitemap to IndexNow
        if: env.INDEXNOW_KEY != ''
        continue-on-error: true
        run: bun scripts/indexnow.ts
