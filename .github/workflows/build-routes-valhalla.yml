name: Build routed truck lines (Valhalla)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0" # Weekly rebuild to pick up OSM changes
  push:
    branches: [main]
    paths:
      - "scripts/build-routes-valhalla.js"
      - ".github/workflows/build-routes-valhalla.yml"
      - "docs/valhalla-offline-routing.md"

permissions:
  contents: write

jobs:
  build-routes:
    runs-on: ubuntu-latest
    env:
      VALHALLA_IMAGE: ghcr.io/valhalla/valhalla:latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare data worktree (inputs + outputs)
        run: |
          git fetch origin data
          rm -rf ../data-branch || true
          git worktree add ../data-branch data
          git -C ../data-branch pull --ff-only
          echo "Data worktree contents:"
          ls -la ../data-branch
          echo "Data input routes dir:"
          ls -la ../data-branch/data-input || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare directories
        run: |
          mkdir -p build valhalla

      - name: Pull Valhalla image
        run: docker pull $VALHALLA_IMAGE

      - name: Download Taiwan OSM extract
        run: |
          curl -L https://download.geofabrik.de/asia/taiwan-latest.osm.pbf -o build/taiwan.osm.pbf

      - name: Build Valhalla config and tiles
        run: |
          docker run --rm -v $PWD:/data -w /data $VALHALLA_IMAGE bash -c "\
            valhalla_build_config --mjolnir-tile-dir /data/valhalla/tiles --mjolnir-admin /usr/local/share/admins.sqlite --mjolnir-timezone /usr/share/zoneinfo > /data/valhalla.json"

          # Loosen service limits to allow long waypoint lists
          jq '
            def init_limits(name):
              (.service_limits[name] //= {}) |
              (.service_limits[name].max_locations //= 500) |
              (.service_limits[name].max_distance //= 50000000) |
              (.service_limits[name].max_matrix_distance //= 50000000) |
              (.service_limits[name].max_matrix_location_pairs //= 250000);

            (.service_limits //= {}) |
            init_limits("auto") |
            init_limits("auto_shorter") |
            init_limits("truck") |
            init_limits("bus") |
            init_limits("motorcycle") |
            init_limits("motor_scooter") |
            init_limits("pedestrian") |
            init_limits("bicycle") |
            init_limits("matrix") |
            init_limits("optimized_route") |
            (.mjolnir.tile_extract = null)
          ' valhalla.json > valhalla.json.tmp && mv valhalla.json.tmp valhalla.json

          docker run --rm -v $PWD:/data -w /data $VALHALLA_IMAGE bash -c "\
            mkdir -p /data/valhalla/tiles && \
            valhalla_build_tiles -c /data/valhalla.json /data/build/taiwan.osm.pbf"

      - name: Build routed GeoJSON from waypoints
        run: |
          ROUTE_DIR=$(realpath ../data-branch/data-input/routes)
          echo "Listing route definitions under $ROUTE_DIR"
          ls -la "$ROUTE_DIR" || true
          find "$ROUTE_DIR" -maxdepth 2 -type f -name "*.geojson" -print 2>/dev/null | head -n 20 || true
          ROUTE_COUNT=$(find "$ROUTE_DIR" -name "*.geojson" -print 2>/dev/null | wc -l || echo 0)
          echo "Route file count: $ROUTE_COUNT"
          if [ "$ROUTE_COUNT" -eq 0 ]; then
            echo "No route definitions found in data branch; skipping."
            exit 0
          fi
          node scripts/build-routes-valhalla.js \
            --routes-dir="$ROUTE_DIR" \
            --out-dir=build/routes \
            --valhalla-config-host=valhalla.json \
            --valhalla-config-container=/data/valhalla.json

      - name: Generate route metadata
        run: |
          if [ ! -d build/routes ]; then
            echo "No routes generated; skipping metadata generation."
            exit 0
          fi
          
          # Copy generated routes first (needed for metadata generation)
          rsync -a --delete build/routes/ ../data-branch/routes/
          
          # Generate metadata from waypoint files using script from main branch
          node scripts/generate-route-metadata.js ../data-branch

      - name: Publish to data branch
        run: |
          if [ ! -d build/routes ]; then
            echo "No routes generated; skipping publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cd ../data-branch
          git add routes

          if git diff --cached --quiet; then
            echo "No route changes to commit."
            exit 0
          fi

          git commit -m "Update routed garbage truck lines"
          git push origin HEAD:data
